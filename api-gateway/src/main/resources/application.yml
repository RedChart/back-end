server:
  port: 8081
spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**

        - id: newsfeed-service
          uri: lb://newsfeed-service
          predicates:
            - Path=/api/newsfeed/**

        - id: stock-service
          uri: lb://stock-service
          predicates:
            - Path=/api/stocks/**

        - id: stock-api-service
          uri: lb://stock-api-service
          predicates:
            - Path=/api/stocks-api/**


        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/v3/api-docs/**, /api/users/swagger-ui/**
            - Method=GET
          filters:
            - RewritePath=/api/users/(?<path>.*), /$\{path}

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/v3/api-docs/**, /api/posts/swagger-ui/**
            - Method=GET
          filters:
            - RewritePath=/api/posts/(?<path>.*), /$\{path}

        - id: newsfeed-service
          uri: lb://newsfeed-service
          predicates:
            - Path=/api/newsfeed/v3/api-docs/**, /api/newsfeed/swagger-ui/**
            - Method=GET
          filters:
            - RewritePath=/api/newsfeed/(?<path>.*), /$\{path}

        - id: stock-service
          uri: lb://stock-service
          predicates:
            - Path=/api/stocks/v3/api-docs/**, /api/stocks/swagger-ui/**
            - Method=GET
          filters:
            - RewritePath=/api/stocks/(?<path>.*), /$\{path}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

jwt:
  secret: 7ae96706cd6e6aade43a3b843bb3317f823ab927b64beb8d45558b3ac29f079dd36afe40f1646af31c334ccbb568cfe64b9e4e54a47aa5a5077796eca1e58075

springdoc:
  swagger-ui:
    urls[0]:
      name: 유저 서비스
      url: http://localhost:8082/api/users/v3/api-docs
    urls[1]:
      name: 포스팅 서비스
      url: http://localhost:8083/api/posts/v3/api-docs
    urls[2]:
      name: 뉴스피드 서비스
      url: http://localhost:8084/api/newsfeed/v3/api-docs
    use-root-path: true

    urls:
      - name: user-service
        url: /api/users/v3/api-docs
      - name: post-service
        url: /api/posts/v3/api-docs
      - name: newsfeed-service
        url: /api/newsfeed/v3/api-docs